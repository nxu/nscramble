name: NScramble
options:
  bundleIdPrefix: hu.nxu
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
packages:
  ScrambleKit:
    path: Packages/ScrambleKit
  StatsKit:
    path: Packages/StatsKit
  Storage:
    path: Packages/Storage
  TimerKit:
    path: Packages/TimerKit
targets:
  NScramble:
    type: application
    supportedDestinations: [macOS, iOS]
    sources: [App/Sources, App/Resources]
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Plain http is only used for a local sync server during development.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: ScrambleKit
      - package: StatsKit
      - package: Storage
      - package: TimerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.nxu.nscramble
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        # Sign to Run Locally; set DEVELOPMENT_TEAM to deploy to a physical iPad.
        CODE_SIGN_IDENTITY: "-"
