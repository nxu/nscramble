name: NScramble
options:
  bundleIdPrefix: hu.nxu
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
packages:
  ScrambleKit:
    path: Packages/ScrambleKit
  StatsKit:
    path: Packages/StatsKit
  Storage:
    path: Packages/Storage
targets:
  NScramble:
    type: application
    supportedDestinations: [macOS, iOS]
    sources: [App/Sources, App/Resources]
    dependencies:
      - package: ScrambleKit
      - package: StatsKit
      - package: Storage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.nxu.nscramble
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        # Sign to Run Locally; set DEVELOPMENT_TEAM to deploy to a physical iPad.
        CODE_SIGN_IDENTITY: "-"
