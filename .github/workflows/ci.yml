name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # Same tools as locally (just, xcodegen) from the flake's dev shell.
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Package tests
        run: nix develop -c just test
      - name: Build the Mac app
        run: nix develop -c just build-mac
      - name: Build the iOS app (simulator)
        run: nix develop -c just build-ipad
