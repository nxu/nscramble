name = "nscramble-sync"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "nscramble"
# Fill in after `wrangler d1 create nscramble`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Secret, set with `wrangler secret put SYNC_TOKEN` (and in .dev.vars for local dev).
